<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124" width="124" height="124" role="img" aria-labelledby="dfm-logo-title">
  <title id="dfm-logo-title">Durable Functions Monitor</title>
  <!-- The hard shadow of the neo-brutalist poster: a solid block, offset, no blur -->
  <rect x="12" y="12" width="112" height="112" fill="#000"/>
  <!-- The tile -->
  <rect x="4" y="4" width="104" height="104" fill="#FFD400" stroke="#000" stroke-width="8"/>
  <!-- The echo: the same bolt one step behind, like a second print slightly out of register.
       A durable function is replayed from its history, and this is what the history looks like. -->
  <polygon transform="translate(4 5.5)" fill="#6FE3FF" stroke="#000" stroke-width="3" stroke-linejoin="miter"
           points="70,14 30,62 49,62 41,94 82,46 64,46"/>
  <!-- The bolt of Azure Functions -->
  <polygon transform="translate(-3 -1.5)" fill="#000" points="70,14 30,62 49,62 41,94 82,46 64,46"/>
</svg>
