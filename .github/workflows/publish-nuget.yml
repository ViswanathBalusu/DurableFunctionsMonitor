name: publish-nuget

# Publishes to nuget.org, triggered by a version tag:
#
#   git tag v6.9.0            && git push origin main --tags   # the release
#   git tag v6.9.0-rc.1       && git push origin main --tags   # a release candidate
#   git tag v6.9.0-develop.4  && git push origin main --tags   # a development build
#
# The release part of the tag always has to match <VersionPrefix> in
# Directory.Build.props; the suffix is what makes nuget.org treat the package as a
# prerelease, so it stays out of "latest stable" and needs --prerelease to install.
# SemVer orders them the way the names suggest: develop.N < rc.N < the release.
#
# Prereleases meant for this repo's own consumers do not have to come here at all -
# main-build.yml publishes <VersionPrefix>-preview.<run> to GitHub Packages on every
# push to main, and nothing pushed to nuget.org can ever be deleted, only unlisted.
#
# Auth is NuGet Trusted Publishing (OIDC) - there is no API key secret.
# The nuget.org policy is bound to THIS filename (publish-nuget.yml) and to the
# 'release' environment used below; renaming either breaks the policy.
#
# Requires repository variable PACKAGE_ID_PREFIX (Settings > Secrets and variables >
# Actions > Variables) and environment secret NUGET_USER on the 'release' environment.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: tag must match Directory.Build.props
      id: v
      run: |
        set -euo pipefail
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)

        # v6.9.0, or a prerelease of it: v6.9.0-rc.1, v6.9.0-develop.4. Anything else is a tag
        # this workflow has no opinion about, and a tag it cannot turn into a package version.
        if [[ ! "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(develop|rc)\.[0-9]+)?$ ]]; then
          echo "::error::Tag $GITHUB_REF_NAME is not a version this workflow publishes."
          echo "::error::Use v<x.y.z> for a release, or v<x.y.z>-rc.<n> / v<x.y.z>-develop.<n> for a prerelease."
          exit 1
        fi

        RELEASE_PART="${BASH_REMATCH[1]}"
        SUFFIX="${BASH_REMATCH[2]:-}"

        # Only the release part is pinned to the props file: a prerelease of 6.9.0 is still 6.9.0's,
        # and VersionPrefix keeps feeding AssemblyVersion, which has to stay numeric.
        if [ "$RELEASE_PART" != "$PREFIX" ]; then
          echo "::error::Tag $GITHUB_REF_NAME is a version of '$RELEASE_PART', but Directory.Build.props says '$PREFIX'. Bump VersionPrefix and re-tag."
          exit 1
        fi

        echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing $TAG_VERSION${SUFFIX:+ (a prerelease: nuget.org will not list it as latest stable)}"

    - name: package id prefix must be set
      env:
        PACKAGE_ID_PREFIX: ${{ vars.PACKAGE_ID_PREFIX }}
      run: |
        if [ -z "${PACKAGE_ID_PREFIX}" ]; then
          echo "::error::Repository variable PACKAGE_ID_PREFIX is not set."
          echo "::error::DurableFunctionsMonitor.DotNetIsolated and .MsSql already exist on nuget.org under different"
          echo "::error::owners (durablefunctionsmonitor, kolepes), so pushing them from this repo will be rejected."
          echo "::error::Set PACKAGE_ID_PREFIX to a prefix you own, including the trailing dot - e.g. 'Balusu.'"
          echo "::error::Only remove this check once you hold co-ownership of the upstream package ids."
          exit 1
        fi
        echo "Publishing with package id prefix '${PACKAGE_ID_PREFIX}'"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      package-id-prefix: ${{ vars.PACKAGE_ID_PREFIX }}

  publish:
    needs: [ preflight, build ]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      id-token: write     # required for the OIDC token that NuGet/login exchanges
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: packages
        path: packages

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT the email address

    - name: push to nuget.org
      run: |
        dotnet nuget push "packages/*.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
