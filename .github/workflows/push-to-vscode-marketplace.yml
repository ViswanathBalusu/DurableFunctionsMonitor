name: push-to-vscode-marketplace

# Publishes the VSIX produced by the shared build to the VsCode Marketplace.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: read version from Directory.Build.props
      id: v
      run: |
        set -euo pipefail
        PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
        if [ -z "$PREFIX" ]; then echo "::error::VersionPrefix not found in Directory.Build.props"; exit 1; fi
        echo "version=$PREFIX" >> "$GITHUB_OUTPUT"

    - name: publisher must be set
      env:
        VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
      run: |
        if [ -z "${VSCE_PUBLISHER}" ]; then
          echo "::error::Repository variable VSCE_PUBLISHER is not set."
          echo "::error::package.json still names the upstream publisher 'DurableFunctionsMonitor', which this"
          echo "::error::fork cannot publish to. Create your own publisher at https://marketplace.visualstudio.com/manage"
          echo "::error::and set VSCE_PUBLISHER to its id. Clear this check only if you are a member of the"
          echo "::error::upstream publisher."
          exit 1
        fi
        echo "Publishing as publisher '${VSCE_PUBLISHER}'"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vsix
        path: drop

    - name: npm install vsce
      run: npm install -g @vscode/vsce

    - name: publish vsix
      env:
        VSCODE_MARKETPLACE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
      run: vsce publish --pat "$VSCODE_MARKETPLACE_PAT" --packagePath drop/durablefunctionsmonitor*.vsix
