name: build

# Reusable build. Produces the NuGet packages and the VSIX, but never publishes anything.
# Called by pr-build.yml, main-build.yml and publish-nuget.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Full package version to stamp (e.g. 6.9.0 or 6.9.0-preview.42)'
        required: true
        type: string
      package-id-prefix:
        description: 'Prefix applied to every package id, including the trailing dot. Empty = upstream ids.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    # One build per ref per caller. The end-to-end half of this job installs the Core Tools, starts
    # two Functions hosts and seeds a task hub; a second run of the same branch adds nothing but
    # queue time, and on a pull request the older run is answering a question nobody is asking any
    # more. On main nothing is cancelled: every commit there gets its own answer.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      # nuget.config authenticates the 'github' fallback source through these. Without them restore
      # still works - it just warns and falls back to nuget.org - but prerelease
      # DurableFunctionsMonitor.* packages would not resolve.
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The integration tests skip themselves when no Storage emulator is listening, so that a
      # developer without one can still run the whole suite. In CI that would silently hide a broken
      # storage layer, so here an unreachable emulator has to be a failure instead.
      DFM_TEST_REQUIRE_STORAGE: "true"

    steps:
    - uses: actions/checkout@v7

    - name: create ArtifactStagingDirectory folder
      run: mkdir drop

    # Building, checking and testing the Svelte UI

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: durablefunctionsmonitor.svelte/package-lock.json

    # Storage emulator for tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests, for the end-to-end
    # specs, and for the Table discovery tests of the extension.
    #
    # Not the docker image as a service container: the Azure Storage SDKs ask for a service API version that is newer
    # than the newest Azurite knows ("The API version ... is not supported by Azurite"), and Azurite refuses the request,
    # unless it is started with --skipApiVersionCheck, which a service container cannot be given. Production is not
    # affected: the Azure Storage service supports every version its SDKs ask for.
    - name: start Azurite
      run: |
        mkdir -p "$RUNNER_TEMP/azurite"
        nohup npx --yes azurite@3.37.0 --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" > "$RUNNER_TEMP/azurite.log" 2>&1 &

    # nuget pack infers no dependencies from a hand-written .nuspec, so a PackageReference added to a
    # library and not mirrored into its .nuspec ships a package that restores and builds fine and then
    # throws FileNotFoundException in the consumer app. Checked here, ahead of the long build below.
    - name: verify the NuGet packages declare every dependency their assemblies need
      run: node scripts/harness/verify-nuspec-dependencies.mjs

    - name: npm ci durablefunctionsmonitor.svelte
      run: npm ci
      working-directory: durablefunctionsmonitor.svelte

    - name: npm run lint
      run: npm run lint
      working-directory: durablefunctionsmonitor.svelte

    - name: npm run check
      run: npm run check
      working-directory: durablefunctionsmonitor.svelte

    - name: npm test
      run: npm test
      working-directory: durablefunctionsmonitor.svelte

    - name: npm run build
      run: npm run build
      working-directory: durablefunctionsmonitor.svelte

    # The host serves these files and fills seven placeholder tags in index.html; the contract that
    # keeps that working is checked here rather than discovered at runtime (00-shared-contracts.md §2)
    - name: verify the build output contract
      run: node scripts/harness/verify-build-contract.mjs durablefunctionsmonitor.svelte/build

    - name: copy statics to durablefunctionsmonitor.dotnetisolated/DfmStatics
      run: |
        rm -rf durablefunctionsmonitor.dotnetisolated/DfmStatics
        cp -r durablefunctionsmonitor.svelte/build durablefunctionsmonitor.dotnetisolated/DfmStatics

    # Building and testing .NET

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: wait for Azurite
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          # Any HTTP response means it is listening; unauthenticated requests answer 403
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:10000/devstoreaccount1; then
            echo "Azurite is up"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Azurite did not become reachable on port 10000"
        exit 1

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests/*.csproj -c Release

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests/*.csproj -c Release

    # End to end, against the standalone host on the Azurite service container above. The Playwright
    # webServer entry starts the host itself (scripts/harness/start-host.mjs), which needs the Core
    # Tools on PATH and serves the statics copied in above.

    - name: install the Azure Functions Core Tools
      run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

    - name: install the Playwright browser
      run: npx playwright install --with-deps chromium
      working-directory: durablefunctionsmonitor.svelte

    - name: seed the end-to-end task hub
      run: npm run seed
      working-directory: durablefunctionsmonitor.svelte

    - name: npx playwright test
      run: npx playwright test
      working-directory: durablefunctionsmonitor.svelte

    - name: upload the Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: durablefunctionsmonitor.svelte/playwright-report
        if-no-files-found: warn

    # The traces of the retried specs (playwright.config.ts: `trace: 'on-first-retry'`), which is the
    # only way to see what a failure on a runner actually did - screenshots and the DOM at each step
    - name: upload the Playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: durablefunctionsmonitor.svelte/test-results
        if-no-files-found: ignore

    - name: copy durablefunctionsmonitor.dotnetisolated to ArtifactStagingDirectory
      run: cp -r durablefunctionsmonitor.dotnetisolated drop/durablefunctionsmonitor.dotnetisolated

    - name: dotnet publish durablefunctionsmonitor.dotnetisolated
      run: dotnet publish durablefunctionsmonitor.dotnetisolated -c Release -p:Version=${{ inputs.version }} --output drop/durablefunctionsmonitor.dotnetisolated/output
    - name: dotnet publish dotnetIsolated-mssql
      run: dotnet publish custom-backends/dotnetIsolated-mssql -c Release -p:Version=${{ inputs.version }} --output drop/dotnetIsolated-mssql/output
    - name: dotnet publish dotnetIsolated-netherite
      run: dotnet publish custom-backends/dotnetIsolated-netherite -c Release -p:Version=${{ inputs.version }} --output drop/dotnetIsolated-netherite/output

    # Building nuget packages

    - name: copy LICENSE.txt and README.md into each publish output
      run: |
        set -euo pipefail
        for d in durablefunctionsmonitor.dotnetisolated dotnetIsolated-mssql dotnetIsolated-netherite; do
          cp durablefunctionsmonitor.dotnetisolated/LICENSE.txt drop/$d/output/
        done
        # nuget pack sweeps everything in each publish output into the package root (the nuspec's
        # '<file src="..\output\*" target="/" />' entry), which is how each package's own README.md,
        # named by <readme> in its nuspec, ends up where NuGet requires it.
        cp durablefunctionsmonitor.dotnetisolated.core/README.md      drop/durablefunctionsmonitor.dotnetisolated/output/
        cp durablefunctionsmonitor.dotnetisolated.mssql/README.md     drop/dotnetIsolated-mssql/output/
        cp durablefunctionsmonitor.dotnetisolated.netherite/README.md drop/dotnetIsolated-netherite/output/

    - name: Install latest nuget.exe
      uses: nuget/setup-nuget@v4

    - name: pack nuget packages
      env:
        VERSION: ${{ inputs.version }}
        PREFIX: ${{ inputs.package-id-prefix }}
      run: |
        set -euo pipefail
        pack () {
          local dir="$1" base_id="$2"
          local id="${PREFIX}${base_id}"
          echo "::group::pack $id $VERSION"
          nuget pack "drop/$dir/output/nuspec.nuspec" \
            -Properties "id=$id;version=$VERSION" \
            -OutputDirectory drop/packages
          echo "::endgroup::"
        }
        pack durablefunctionsmonitor.dotnetisolated DurableFunctionsMonitor.DotNetIsolated
        pack dotnetIsolated-mssql               DurableFunctionsMonitor.DotNetIsolated.MsSql
        pack dotnetIsolated-netherite           DurableFunctionsMonitor.DotNetIsolated.Netherite
        ls -la drop/packages

    # Building the vscode extension.
    # Custom backends ship as published binaries, because they reference
    # durablefunctionsmonitor.dotnetisolated.* by project and cannot be built from the VSIX itself.

    - name: copy dotnetisolated to durablefunctionsmonitor-vscodeext/backend
      run: cp -r drop/durablefunctionsmonitor.dotnetisolated/output durablefunctionsmonitor-vscodeext/backend

    - name: copy custom backends to durablefunctionsmonitor-vscodeext/custom-backends
      run: |
        mkdir -p durablefunctionsmonitor-vscodeext/custom-backends
        cp -r drop/dotnetIsolated-mssql/output     durablefunctionsmonitor-vscodeext/custom-backends/dotnetIsolated-mssql
        cp -r drop/dotnetIsolated-netherite/output durablefunctionsmonitor-vscodeext/custom-backends/dotnetIsolated-netherite

    - name: npm ci durablefunctionsmonitor-vscodeext
      run: npm ci
      working-directory: durablefunctionsmonitor-vscodeext

    # The extension is checked before it is packaged: types, lint, the unit tests, and the tests inside of a real VsCode.
    # No Azure Functions Core Tools are installed for them. The extension downloads its own when it needs them,
    # and the integration tests start a stand-in for func.
    - name: npm run typecheck durablefunctionsmonitor-vscodeext
      run: npm run typecheck
      working-directory: durablefunctionsmonitor-vscodeext
    - name: npm run lint durablefunctionsmonitor-vscodeext
      run: npm run lint
      working-directory: durablefunctionsmonitor-vscodeext
    - name: npm run test:unit durablefunctionsmonitor-vscodeext
      # These read the C# source of the backend (routes, header, environment variables), so that the extension cannot
      # fall behind it again, and run the Table discovery against the Azurite of this job, with the task hub that was seeded above.
      # The account key is the one every Storage emulator has.
      env:
        DFM_TEST_STORAGE_CONNECTION_STRING: AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;DefaultEndpointsProtocol=http;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
      run: npm run test:unit
      working-directory: durablefunctionsmonitor-vscodeext
    - name: npm run test:integration durablefunctionsmonitor-vscodeext
      # A real VsCode, which needs a display. It is downloaded by the test runner.
      # When it fails, the end of what it wrote becomes an annotation of the run: the log of a step can be read by whoever is
      # signed in, the annotations by anyone, and VsCode writes hundreds of lines of its own around the few that matter.
      run: |
        npm run build
        set +e
        xvfb-run -a npm run test:integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
        code=${PIPESTATUS[0]}
        set -e
        if [ "$code" -ne 0 ]; then
          detail=$(grep -v -F -e '[AgentHost]' -e '[ChatModelSelection]' "$RUNNER_TEMP/integration.log" | tail -n 70 | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=integration tests failed (exit code $code)::$detail"
        fi
        exit $code
      working-directory: durablefunctionsmonitor-vscodeext

    - name: stamp VSIX version and publisher
      env:
        VERSION: ${{ inputs.version }}
        VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
      working-directory: durablefunctionsmonitor-vscodeext
      run: |
        set -euo pipefail
        # The VsCode Marketplace only accepts major.minor.patch, so drop any prerelease suffix.
        # Only push-to-vscode-marketplace.yml actually publishes, and it passes a clean version.
        VSIX_VERSION="${VERSION%%-*}"
        npm version "$VSIX_VERSION" --no-git-tag-version --allow-same-version
        # The upstream publisher id cannot be published to from this fork. Override it when
        # the VSCE_PUBLISHER repository variable is set.
        #
        # package.json "name" is deliberately NOT the upstream durablefunctionsmonitor. The VsCode
        # Marketplace requires an extension name to be unique across ALL publishers, not just within
        # one, so publishing the upstream name from a fork is rejected with "The extension
        # durablefunctionsmonitor already exists in the Marketplace" - which is how v6.10.0 failed.
        # Do not restore it. The .vsix is named after it, so the globs below stay extension-agnostic.
        # The same uniqueness rule applies to "displayName" - 6.10.1 renamed only "name" and was
        # rejected with "This extension display name is taken". Both have to differ from upstream.
        if [ -n "${VSCE_PUBLISHER}" ]; then
          node -e "const f='package.json',j=require('./'+f);j.publisher=process.env.VSCE_PUBLISHER;require('fs').writeFileSync(f,JSON.stringify(j,null,4)+'\n')"
        fi
        node -e "const j=require('./package.json');console.log('VSIX will be '+j.publisher+'.'+j.name+' v'+j.version)"

    - name: package durablefunctionsmonitor-vscodeext to VSIX-file
      run: npm run package
      working-directory: durablefunctionsmonitor-vscodeext
    - name: copy VSIX-file to ArtifactStagingDirectory
      run: cp durablefunctionsmonitor-vscodeext/*.vsix drop

    # Publish artifacts

    - name: upload nuget packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: drop/packages/*.nupkg
        if-no-files-found: error

    - name: upload vsix
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: drop/*.vsix
        if-no-files-found: error
