name: build

# Reusable build. Produces the NuGet packages and the VSIX, but never publishes anything.
# Called by pr-build.yml, main-build.yml and publish-nuget.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Full package version to stamp (e.g. 6.9.0 or 6.9.0-preview.42)'
        required: true
        type: string
      package-id-prefix:
        description: 'Prefix applied to every package id, including the trailing dot. Empty = upstream ids.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # nuget.config authenticates the 'github' fallback source through these. Without them restore
      # still works - it just warns and falls back to nuget.org - but prerelease
      # DurableFunctionsMonitor.* packages would not resolve.
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The integration tests skip themselves when no Storage emulator is listening, so that a
      # developer without one can still run the whole suite. In CI that would silently hide a broken
      # storage layer, so here an unreachable emulator has to be a failure instead.
      DFM_TEST_REQUIRE_STORAGE: "true"

    services:
      # Storage emulator for tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
    - uses: actions/checkout@v4

    - name: create ArtifactStagingDirectory folder
      run: mkdir drop

    # Building and copying React

    - name: npm install durablefunctionsmonitor.react
      run: npm install -legacy-peer-deps
      working-directory: durablefunctionsmonitor.react
    - name: npm build durablefunctionsmonitor.react
      run: npm run build
      working-directory: durablefunctionsmonitor.react

    - name: copy statics to durablefunctionsmonitor.dotnetisolated/DfmStatics
      run: |
        rm -rf durablefunctionsmonitor.dotnetisolated/DfmStatics
        cp -r durablefunctionsmonitor.react/build durablefunctionsmonitor.dotnetisolated/DfmStatics

    # Building and testing .NET

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: wait for Azurite
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          # Any HTTP response means it is listening; unauthenticated requests answer 403
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:10000/devstoreaccount1; then
            echo "Azurite is up"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Azurite did not become reachable on port 10000"
        exit 1

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests/*.csproj -c Release

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests/*.csproj -c Release

    - name: copy durablefunctionsmonitor.dotnetisolated to ArtifactStagingDirectory
      run: cp -r durablefunctionsmonitor.dotnetisolated drop/durablefunctionsmonitor.dotnetisolated

    - name: dotnet publish durablefunctionsmonitor.dotnetisolated
      run: dotnet publish durablefunctionsmonitor.dotnetisolated -c Release -p:Version=${{ inputs.version }} --output drop/durablefunctionsmonitor.dotnetisolated/output
    - name: dotnet publish dotnetIsolated-mssql
      run: dotnet publish custom-backends/dotnetIsolated-mssql -c Release -p:Version=${{ inputs.version }} --output drop/dotnetIsolated-mssql/output
    - name: dotnet publish dotnetIsolated-netherite
      run: dotnet publish custom-backends/dotnetIsolated-netherite -c Release -p:Version=${{ inputs.version }} --output drop/dotnetIsolated-netherite/output

    # Building nuget packages

    - name: copy LICENSE.txt into each publish output
      run: |
        for d in durablefunctionsmonitor.dotnetisolated dotnetIsolated-mssql dotnetIsolated-netherite; do
          cp durablefunctionsmonitor.dotnetisolated/LICENSE.txt drop/$d/output/
        done

    - name: Install latest nuget.exe
      uses: nuget/setup-nuget@v4

    - name: pack nuget packages
      env:
        VERSION: ${{ inputs.version }}
        PREFIX: ${{ inputs.package-id-prefix }}
      run: |
        set -euo pipefail
        pack () {
          local dir="$1" base_id="$2"
          local id="${PREFIX}${base_id}"
          echo "::group::pack $id $VERSION"
          nuget pack "drop/$dir/output/nuspec.nuspec" \
            -Properties "id=$id;version=$VERSION" \
            -OutputDirectory drop/packages
          echo "::endgroup::"
        }
        pack durablefunctionsmonitor.dotnetisolated DurableFunctionsMonitor.DotNetIsolated
        pack dotnetIsolated-mssql               DurableFunctionsMonitor.DotNetIsolated.MsSql
        pack dotnetIsolated-netherite           DurableFunctionsMonitor.DotNetIsolated.Netherite
        ls -la drop/packages

    # Building the vscode extension.
    # Custom backends ship as published binaries, because they reference
    # durablefunctionsmonitor.dotnetisolated.* by project and cannot be built from the VSIX itself.

    - name: copy dotnetisolated to durablefunctionsmonitor-vscodeext/backend
      run: cp -r drop/durablefunctionsmonitor.dotnetisolated/output durablefunctionsmonitor-vscodeext/backend

    - name: copy custom backends to durablefunctionsmonitor-vscodeext/custom-backends
      run: |
        mkdir -p durablefunctionsmonitor-vscodeext/custom-backends
        cp -r drop/dotnetIsolated-mssql/output     durablefunctionsmonitor-vscodeext/custom-backends/dotnetIsolated-mssql
        cp -r drop/dotnetIsolated-netherite/output durablefunctionsmonitor-vscodeext/custom-backends/dotnetIsolated-netherite

    - name: npm install durablefunctionsmonitor-vscodeext
      run: npm install
      working-directory: durablefunctionsmonitor-vscodeext
    - name: npm install -g azure-functions-core-tools@4
      run: npm install -g azure-functions-core-tools@4
      working-directory: durablefunctionsmonitor-vscodeext
    - name: run tests on durablefunctionsmonitor-vscodeext
      # TODO: vscode test pipeline was broken, need to investigate and fix
      if: 'false'
      run: npm run test
      working-directory: durablefunctionsmonitor-vscodeext
    - name: stamp VSIX version and publisher
      env:
        VERSION: ${{ inputs.version }}
        VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
      working-directory: durablefunctionsmonitor-vscodeext
      run: |
        set -euo pipefail
        # The VsCode Marketplace only accepts major.minor.patch, so drop any prerelease suffix.
        # Only push-to-vscode-marketplace.yml actually publishes, and it passes a clean version.
        VSIX_VERSION="${VERSION%%-*}"
        npm version "$VSIX_VERSION" --no-git-tag-version --allow-same-version
        # The upstream publisher id cannot be published to from this fork. Override it when
        # the VSCE_PUBLISHER repository variable is set.
        if [ -n "${VSCE_PUBLISHER}" ]; then
          node -e "const f='package.json',j=require('./'+f);j.publisher=process.env.VSCE_PUBLISHER;require('fs').writeFileSync(f,JSON.stringify(j,null,4)+'\n')"
        fi
        node -e "const j=require('./package.json');console.log('VSIX will be '+j.publisher+'.'+j.name+' v'+j.version)"

    - name: package durablefunctionsmonitor-vscodeext to VSIX-file
      run: npm run package
      working-directory: durablefunctionsmonitor-vscodeext
    - name: copy VSIX-file to ArtifactStagingDirectory
      run: cp durablefunctionsmonitor-vscodeext/durablefunctionsmonitor*.vsix drop

    # Publish artifacts

    - name: upload nuget packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: drop/packages/*.nupkg
        if-no-files-found: error

    - name: upload vsix
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: drop/*.vsix
        if-no-files-found: error
