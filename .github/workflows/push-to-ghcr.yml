name: push-to-ghcr

# Publishes the three container images to this repository's GitHub Container Registry namespace.
# GHCR needs no secrets of its own: GITHUB_TOKEN authenticates it, which is why this replaced the
# Docker Hub workflow (it needed DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to be set up first).
#
# Runs on every version tag, next to publish-nuget.yml, so that a release ships its images without
# anyone remembering to dispatch this:
#
#   v6.9.0            -> images tagged 6.9.0 and latest
#   v6.9.0-rc.1       -> images tagged 6.9.0-rc.1  ('latest' is left where it is)
#   v6.9.0-develop.4  -> images tagged 6.9.0-develop.4
#
# It can still be dispatched by hand with an arbitrary tag, which is the only way to get an image
# out of a branch that has no version tag.
#
# Each image builds the UI itself (the `ui` stage of every Dockerfile, E12-S1-T1), so nothing here
# builds or copies statics; the .NET tests below are what this workflow adds on top of the images.
# They run on tag pushes too, duplicating build.yml's: an image on ghcr.io can be deleted but not
# un-pulled, so it is worth the few minutes to not publish one that fails its own tests.

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Docker image tag to be applied
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # ...which is what pushing to ghcr.io needs, and all it needs
  packages: write

jobs:
  # Works out what to tag the images with before the build job spends ten minutes on tests whose
  # result it would then have nowhere to put.
  preflight:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}

    steps:
    - uses: actions/checkout@v4

    - name: resolve the image tag
      id: v
      env:
        # Never inline a dispatch input into the script itself
        IMAGE_TAG: ${{ github.event.inputs.imageTag }}
      run: |
        set -euo pipefail

        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          echo "version=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest=false" >> "$GITHUB_OUTPUT"
          echo "Tagging the images '$IMAGE_TAG' (manual run - 'latest' is left where it is)"
          exit 0
        fi

        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)

        # The same shape publish-nuget.yml publishes, so a version cannot exist as a package
        # without existing as an image, or the other way round.
        if [[ ! "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(develop|rc)\.[0-9]+)?$ ]]; then
          echo "::error::Tag $GITHUB_REF_NAME is not a version this workflow publishes."
          echo "::error::Use v<x.y.z> for a release, or v<x.y.z>-rc.<n> / v<x.y.z>-develop.<n> for a prerelease."
          exit 1
        fi

        RELEASE_PART="${BASH_REMATCH[1]}"
        SUFFIX="${BASH_REMATCH[2]:-}"

        if [ "$RELEASE_PART" != "$PREFIX" ]; then
          echo "::error::Tag $GITHUB_REF_NAME is a version of '$RELEASE_PART', but Directory.Build.props says '$PREFIX'. Bump VersionPrefix and re-tag."
          exit 1
        fi

        echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

        # Only a release moves 'latest'. A prerelease that took it would hand it to every
        # `docker pull` that does not name a tag.
        if [ -z "$SUFFIX" ]; then
          echo "latest=true" >> "$GITHUB_OUTPUT"
          echo "Tagging the images '$TAG_VERSION' and 'latest'"
        else
          echo "latest=false" >> "$GITHUB_OUTPUT"
          echo "Tagging the images '$TAG_VERSION' (a prerelease - 'latest' is left where it is)"
        fi

  build:

    needs: preflight

    runs-on: ubuntu-latest

    env:
      # Authenticates the 'github' fallback source in nuget.config. See .github/workflows/build.yml.
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The integration tests skip themselves when no Storage emulator is listening, so that a
      # developer without one can still run the whole suite. In CI that would silently hide a broken
      # storage layer, so here an unreachable emulator has to be a failure instead.
      DFM_TEST_REQUIRE_STORAGE: "true"

    services:
      # Storage emulator for tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
    - uses: actions/checkout@v4

    # Testing .NET

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: wait for Azurite
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          # Any HTTP response means it is listening; unauthenticated requests answer 403
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:10000/devstoreaccount1; then
            echo "Azurite is up"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Azurite did not become reachable on port 10000"
        exit 1

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests/*.csproj

    - name: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests
      run: dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.integrationtests/*.csproj

    # Publishing the images

    - name: login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # One newline-separated tag list per image. An image name has to be lower case; a GitHub
    # account name does not have to be.
    - name: image tags
      id: tags
      env:
        VERSION: ${{ needs.preflight.outputs.version }}
        LATEST: ${{ needs.preflight.outputs.latest }}
      run: |
        set -euo pipefail
        REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
        for name in durablefunctionsmonitor durablefunctionsmonitor.mssql durablefunctionsmonitor.netherite; do
          {
            echo "${name//./_}<<TAGS_EOF"
            echo "$REGISTRY/$name:$VERSION"
            if [ "$LATEST" = "true" ]; then echo "$REGISTRY/$name:latest"; fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
        done

    # NOTE: build context is the repo root for all images, because the projects
    # reference durablefunctionsmonitor.dotnetisolated.core by project reference

    - name: build and push durablefunctionsmonitor.dotnetisolated
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./durablefunctionsmonitor.dotnetisolated/Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.durablefunctionsmonitor }}

    - name: build and push custom-backends/dotnetIsolated-mssql
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./custom-backends/dotnetIsolated-mssql/Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.durablefunctionsmonitor_mssql }}

    - name: build and push custom-backends/dotnetIsolated-netherite
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./custom-backends/dotnetIsolated-netherite/Dockerfile
        push: true
        tags: ${{ steps.tags.outputs.durablefunctionsmonitor_netherite }}
